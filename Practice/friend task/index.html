<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usama Practice</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div ul li {
            list-style: none;

        }
        ul {
            display: inline-flex;
            gap: 20px;
            
        }
        li {
            margin-top: 15px;
            outline: 2px solid rgb(91, 0, 237);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <nav>
            <ul>
                <li>This is box 1</li>
                <li>This is box 2</li>
                <li>This is box 3</li>
                <li>This is box 4</li>
            </ul>
            <ul class="Second-row">
                <li>Second line box 1</li>
                <li>Second line box 2</li>
                <li>Second line box 3</li>
                <li>Second line box 4</li>
            </ul>
        </nav>
    </div>
    
</body>
</html>
