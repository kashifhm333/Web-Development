<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>external selector</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        a:visited{
            color: red;
        }
        a:link{
            color: green;
        }
        a:active{
            background-color: red;
        }
        a:hover{
            background-color: rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <div class="red">
        this is class red
    </div>

    <div class="blue">
        this is class blue
    </div>
    <div>
        <a href="https://www.google.com/">Go To Google</a>
    </div>
    
</body>
</html>
