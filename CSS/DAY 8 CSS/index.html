<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css implementation in html`</title>
    <link rel="stylesheet" href="style.css">
    <style>
        article {
            background-color: rgb(0, 0, 0);
            color: blue;
        }
    </style>
</head>

<body>
    <div>
        <h2>inline selector</h2>
        <p style="background-color: orange; color: red;">inline selector in orange color</p>
    </div>

    <div>
        <h2>internal selector</h2>
        <article>internal selector in html</article>
    </div>

    <div>
        <h2>Child selector </h2>
        <article>clid selector in html</article>
    </div>
    <div>
        <h2>Descendant selector</h2>
        <span><p>decendant selector in html</p></span>
    </div>
</body>

</html>
