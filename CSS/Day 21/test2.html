<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Area</title>
    <style>
        .container {
            display: grid;
            width: 80vw;
            grid-template-areas: "nav nav nav"
                                "side article article"
                                "footer footer footer";

        }

        .items {
            border: 2px solid red;
            height: 50px;
            

        }

        .item1 {
            grid-area: nav;
            background-color: lightblue;
        }
        .item2 {
            grid-area: side;
            background-color: rgb(114, 204, 12);
        }
        .item3 {
            grid-area: article;
            background-color: brown;
        }
        .item4 {
            grid-area: footer;
            background-color: lightgray;
        }
        .item5 {
            grid-area: nav;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items item1">1</div>
        <div class="items item2">2</div>
        <div class="items item3">3</div>
        <div class="items item4">4</div>
        <div class="items item5">5</div>
    </div>
</body>

</html>
