<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
           /* grid-template-columns: 120px 100px;
           you also can give names */
           grid-template-columns: [phela] 120px [doosra] 100px [teesra];

            grid-template-rows: 100px 100px 100px;
            
        }
        .item {
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }
        .item-4 {
            grid-row:1/2 ;
            grid-column: doosra/teesra;
            /*  grid-column: 1/2;
          grid-row-start: 1;
            grid-row-end: 2;
            Both work the same
            */
           
        }
       /* .item-1 {
            grid-row:1/2 ;
            grid-column: 1/2;
            if you do this the item-4 will be overlapped
           
        } */
    
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
    </div>
    
</body>
</html>
