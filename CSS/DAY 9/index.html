<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin padding</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .c{
            background-color: aqua;
        }
        .c1{
            margin: 25px;
            padding: 25px;
            border: 3px solid black;
            background-origin: padding-box;
        }
        .c2{
            margin: 25px;
            padding: 25px;
            
        }
        


    </style>
</head>
<body>
    <div class="c c1">this is class one</div>
    <div class="c c2">this is another class</div>
    
</body>
</html>
